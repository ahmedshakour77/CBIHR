<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../wwwroot/css/hr-tokens.css"><link rel="stylesheet" href="../../wwwroot/css/hr-components.css"><meta charset="utf-8"><style>body{margin:0}.wrap{padding:24px;display:grid;gap:16px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}</style></head>
