<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../wwwroot/css/hr-tokens.css"><link rel="stylesheet" href="../../wwwroot/css/hr-components.css"><meta charset="utf-8"><title>FloatingNav</title><style>body{margin:0}.stage{display:grid;justify-items:center;padding:0 12px 12px}#frame{inline-size:100%}.hr-shell{border:1px solid var(--line);border-radius:var(--r-md)}</style></head>
<body class="hr-root">
<div class="hr-seg" role="radiogroup" aria-label="حجم الشاشة" style="justify-content:center;padding:12px">
  <label><input type="radio" name="vp" value="100%" checked><span>سطح المكتب</span></label>
  <label><input type="radio" name="vp" value="880px"><span>جهاز لوحي</span></label>
  <label><input type="radio" name="vp" value="390px"><span>هاتف</span></label>
</div>
<div class="stage"><div id="frame">
<div class="hr-shell hr-shell--float" id="shell" style="block-size:680px">
<a class="hr-skip" href="#main">تخطَّ إلى المحتوى</a>
<div style="overflow:auto;block-size:680px" data-scroll>
<header class="hr-floatbar"><a class="hr-nav__brand" href="#"><img class="hr-logo" src="../../wwwroot/img/cbi-logo.png" alt="البنك المركزي العراقي"><span class="hr-nav__brand-text"><b>الموارد البشرية</b><small>البنك المركزي العراقي</small></span></a>
  <button class="hr-iconbtn" aria-label="بحث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button class="hr-iconbtn" aria-label="الإشعارات، 3 غير مقروءة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="hr-dot"></span></button>
  <div class="hr-user"><div class="hr-avatar" aria-hidden="true">س</div></div>
</header>
<main class="hr-main" id="main" tabindex="-1">
  <ol class="hr-crumbs"><li>خدماتي</li><li>الرئيسية</li></ol>
  <h1 class="hr-main__title">صباح الخير، سارة</h1>
  <div class="hr-ph-row">
    <div class="hr-card hr-kpi"><div class="hr-kpi__label">رصيد الإجازات</div><div class="hr-kpi__value">18</div><div class="hr-kpi__foot">يوم متبقٍ من 36</div></div>
    <div class="hr-card hr-kpi"><div class="hr-kpi__label">طلبات مفتوحة</div><div class="hr-kpi__value">2</div><div class="hr-kpi__foot">إجازة · تحديث مؤهل</div></div>
    <div class="hr-card hr-kpi"><div class="hr-kpi__label">نسبة الالتزام بالدوام</div><div class="hr-kpi__value">96%</div><div class="hr-kpi__foot">آخر 90 يوماً</div></div>
  </div>
  <div class="hr-ph" style="min-block-size:220px"></div>
  <div class="hr-ph" style="min-block-size:160px"></div>
</main>
</div>
<nav class="hr-dock" aria-label="التنقل الرئيسي"><ul><li><a class="hr-nav__item" href="#" data-tip="الرئيسية" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="hr-nav__label">الرئيسية</span></a></li><li><a class="hr-nav__item" href="#" data-tip="طلباتي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 14h4l2 3h4l2-3h4"/></svg><span class="hr-nav__label">طلباتي</span><span class="hr-nav__count" aria-label="2 جديد">2</span></a></li><li><a class="hr-nav__item" href="#" data-tip="الإجازات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span class="hr-nav__label">الإجازات</span></a></li><li><a class="hr-nav__item" href="#" data-tip="الرواتب"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg><span class="hr-nav__label">الرواتب</span></a></li><li><a class="hr-nav__item" href="#" data-tip="ملفي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="hr-nav__label">ملفي</span></a></li></ul></nav>
</div>
</div></div>
<script>
(function(){
  var sh=document.getElementById('shell'), fr=document.getElementById('frame');
  document.querySelectorAll('input[name=vp]').forEach(function(r){r.addEventListener('change',function(){fr.style.maxInlineSize=r.value;close();});});
  var opener=null, drawer=sh.querySelector('[data-drawer]');
  function open(btn){opener=btn;sh.setAttribute('data-drawer-open','');if(btn)btn.setAttribute('aria-expanded','true');if(drawer){drawer.setAttribute('role','dialog');drawer.setAttribute('aria-modal','true');var f=drawer.querySelector('a,button');f&&f.focus();}}
  function close(){if(!sh.hasAttribute('data-drawer-open'))return;sh.removeAttribute('data-drawer-open');if(drawer){drawer.removeAttribute('role');drawer.removeAttribute('aria-modal');}if(opener){opener.setAttribute('aria-expanded','false');opener.focus();}}
  sh.querySelectorAll('[data-open-drawer]').forEach(function(b){b.addEventListener('click',function(){open(b)});});
  sh.querySelectorAll('[data-close-drawer]').forEach(function(b){b.addEventListener('click',close);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();if(e.key==='Tab'&&sh.hasAttribute('data-drawer-open')&&drawer){var f=[].slice.call(drawer.querySelectorAll('a,button,input')).filter(function(x){return x.offsetParent});if(!f.length)return;var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
  var col=sh.querySelector('.hr-nav__collapse');
  if(col)col.addEventListener('click',function(){var c=sh.toggleAttribute('data-collapsed');col.setAttribute('aria-expanded',String(!c));col.setAttribute('aria-label',c?'توسيع القائمة':'طي القائمة');});
  sh.querySelectorAll('[data-toggle-sub]').forEach(function(b){b.addEventListener('click',function(){var s=document.getElementById(b.getAttribute('aria-controls'));var o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!o));s.hidden=o;});});
  sh.querySelectorAll('a.hr-nav__item').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var g=a.closest('.hr-sidenav,.hr-topnav__links,.hr-dock ul,.hr-offcanvas')||sh;sh.querySelectorAll('a.hr-nav__item[aria-current]').forEach(function(x){x.removeAttribute('aria-current')});sh.querySelectorAll('a.hr-nav__item').forEach(function(x){if(x.textContent.trim()===a.textContent.trim())x.setAttribute('aria-current','page')});close();});});
  var dock=sh.querySelector('.hr-dock'), sc=sh.querySelector('[data-scroll]'), last=0;
  if(dock&&sc)sc.addEventListener('scroll',function(){var y=sc.scrollTop;if(dock.contains(document.activeElement)){dock.removeAttribute('data-hidden');}else if(y>last+6&&y>40)dock.setAttribute('data-hidden','');else if(y<last-6)dock.removeAttribute('data-hidden');last=y;});
  var tb=sh.querySelector('.hr-topnav');
  if(tb&&sc)sc.addEventListener('scroll',function(){if(sc.scrollTop>4)tb.setAttribute('data-scrolled','');else tb.removeAttribute('data-scrolled');});
})();
</script>
</body>
</html>
