name: CI / Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-test:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Display .NET Environment Info
      run: dotnet --info

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Application (Release)
      run: dotnet build --no-restore --configuration Release

    - name: Run Cross-Platform Test Suite
      run: >
        dotnet test
        --no-build
        --configuration Release
        --verbosity normal
        --filter "FullyQualifiedName!~Defender_FindEngine_DiscoversEngineOnWindows"

    - name: Vulnerability Scan on Packages
      run: dotnet list package --vulnerable --include-transitive


  windows-security-tests:
    name: Windows Security Tests
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Application (Release)
      run: dotnet build --no-restore --configuration Release

    - name: Run Windows Defender Tests
      run: >
        dotnet test
        --no-build
        --configuration Release
        --verbosity normal
        --filter "FullyQualifiedName~Defender_FindEngine_DiscoversEngineOnWindows"
